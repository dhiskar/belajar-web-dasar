<!DOCTYPE html>
<html>

<head>
    <title>BELAJAR HTML</title>
    <style>
        /* 1. Menghias seluruh halaman */
        body {
            background-color: #ffffff;
            /* Warna abu-abu muda yang nyaman di mata */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Membuat semua konten ke tengah */
            padding-top: 50px;
        }

        /* 2. Menghias Judul (h1) */
        h1 {
            color: #033d88;
            /* Warna biru khas Google */
            border-bottom: 3px solid #1a73e8;
            padding-bottom: 10px;
        }

        /* 3. Menghias Kotak Input */
        input {
            padding: 10px;
            border-radius: 50px;
            border: 2px solid #ccc;
            width: 400px;
            margin-bottom: 10px;
        }

        /* 4. Menghias Tombol agar Terlihat Modern */
        button {
            background-color: #28a745;
            /* Warna hijau */
            color: white;
            padding: 20px 50px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            /* Mengubah kursor jadi tangan saat diarahkan */
            transition: 0.3s;
            /* Efek halus saat berubah warna */
        }

        /* Efek saat tombol disentuh mouse */
        button:hover {
            background-color: #157429;
            transform: scale(1.05);
            /* Sedikit membesar */
        }
    </style>
</head>

<body>
    <h1>Saya sedang belajar Coding</h1>

    <p>Saya sedang belajar HTML dasar.</p>
    <h3>Target Saya</h3>
    <ul>
        <li>Paham HTML</li>
        <li>Jago CSS</li>
        <li>Bisa JavaScript</li>
    </ul>
    <input type="text" id="itemName" placeholder="Masukkan Nama Kamu">
    <button id="btnSimpan" onclick="tampilkanPesan()">Klik Saya</button>
    <p id="pesanSapaan"></p>

</body>
<script>
    // Ini adalah comment yang tidak terbaca
    function tampilkanPesan() {
        const nama = document.getElementById('itemName').value;

        if (nama == "") {
            alert("Nama tidak boleh kosong!");
        } else {
            document.getElementById('pesanSapaan').innerText = "Halo, " + nama + "! Selamat datang di dunia JavaScript!";
        }
    }
</script>

</html>
